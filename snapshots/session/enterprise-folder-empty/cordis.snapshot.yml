# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- insert:
    - id: supplier-webserver
      name: '../../../packages/host/webserver/src/index.ts'
      config:
        host: '127.0.0.1'
        port: 0
    - id: supplier-connection
      name: '../../../packages/client/connection/src/index.ts'
    - id: trade-enterprise
      name: '../../../trade/enterprise/src/host.ts'
      config:
        directory: !!js dshHomePath('enterprise')
        maxFileBytes: 1048576
        maxTotalBytes: 2097152
        maxExtractedCharacters: 10000
        knowledgeChunkCharacters: 512
        maxKnowledgeResults: 5
        maxDecompressedBytes: 1048576
        maxArchiveEntries: 100
        maxTableCells: 1000
