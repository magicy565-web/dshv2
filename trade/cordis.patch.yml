# Deployment-owned extension layer over the upstream Web profile.
# Keep the standard preset until the trade preset has recorded-session coverage.
- insert:
    - id: trade-enterprise
      name: './enterprise/lib/index.js'
      config:
        directory: !!js "process.env.DSH_HOME + '/enterprise'"
        maxFileBytes: 268435456
        maxTotalBytes: 2147483648
        maxExtractedCharacters: 1000000
        knowledgeChunkCharacters: 1200
        maxKnowledgeResults: 8
        maxDecompressedBytes: 134217728
        maxArchiveEntries: 5000
        maxTableCells: 250000
        maxComputerBodyBytes: 1048576
        commerce: !!js "process.env.DSH_COMMERCE_LINK_SECRET_JSON ? JSON.parse(process.env.DSH_COMMERCE_LINK_SECRET_JSON) : undefined"
        siteHosting: !!js "process.env.DSH_SITES_VERCEL_TOKEN ? { token: process.env.DSH_SITES_VERCEL_TOKEN, teamId: process.env.DSH_SITES_VERCEL_TEAM_ID, requestTimeoutMs: 30000, maxResponseBytes: 2097152, maxDeploymentBytes: 16777216, recoveryPageSize: 100, maxRecoveryPages: 20, maxDomains: 50, maxBuildLogEvents: 100, maxDiagnosticCharacters: 20000 } : undefined"
        externalAgentToken: !!js "process.env.DSH_SUPPLIER_AGENT_TOKEN"
        externalSupplierRecords: !!js "JSON.parse(process.env.DSH_SUPPLIER_RECORDS || '[]')"
        externalDocumentIds: !!js "JSON.parse(process.env.DSH_SUPPLIER_DOCUMENTS || '[]')"
